name: Release maintained fork

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing reviewed tag matching the committed manifest version
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - name: Verify release identity
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          test "${{ github.repository }}" = "StigCPH/aula"
          test "${{ github.ref_name }}" = "stig"
          git fetch origin stig
          git merge-base --is-ancestor HEAD origin/stig
          test "$(git describe --tags --exact-match)" = "$RELEASE_TAG"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt -r requirements.test.txt
      - name: Test the tagged source
        run: python -m pytest --tb=short -v
      - name: Build the HACS package
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: python scripts/build_release.py --tag "$RELEASE_TAG"
      - name: Publish immutable source package
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" dist/aula.zip dist/SHA256SUMS \
            --verify-tag --title "Aula (Stig fork) $RELEASE_TAG" \
            --notes-file RELEASE_NOTES.md
